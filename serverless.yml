service: authentication-api

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  
resources:
  Resources:
    # --- Log Group para el servicio ---
    LogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /ecs/authentication-api

    # --- Target Group y Listener Rule para el ALB ---
    TargetGroup:
      Type: AWS::ElasticLoadBalancingV2::TargetGroup
      Properties:
        Name: tg-authentication-api
        VpcId: !ImportValue Crediya-VpcId
        Port: 8080
        Protocol: HTTP
        TargetType: ip
        HealthCheckEnabled: true
        HealthCheckPath: /actuator/health
        HealthCheckIntervalSeconds: 30

    ListenerRule:
      Type: AWS::ElasticLoadBalancingV2::ListenerRule
      Properties:
        ListenerArn:
          Fn::ImportValue: Crediya-ALBListenerArn
        Priority: 1
        Actions:
          - Type: forward
            TargetGroupArn:
              Ref: TargetGroup
        Conditions:
          - Field: path-pattern
            Values:
              - "/auth*"

    # --- Grupo de Seguridad ---
    EcsServiceSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupName: EcsServiceSecurityGroup-auth
        GroupDescription: "Allow traffic from ALB to Authentication Service"
        VpcId: !ImportValue Crediya-VpcId
        SecurityGroupIngress:
          - SourceSecurityGroupId:
              Fn::ImportValue: Crediya-ALBSecurityGroupId
            IpProtocol: tcp
            FromPort: 8080
            ToPort: 8080
        SecurityGroupEgress:
          - Description: "Allow traffic to RDS"
            DestinationSecurityGroupId:
              Fn::ImportValue: Crediya-RDSSecurityGroupId
            IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
          - Description: "Allow HTTPS traffic to Secrets Manager and other AWS services"
            IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0 # Permitir a cualquier destino en el puerto 443

    # --- Task Definition y Servicio de ECS ---
    TaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: authentication-api-task
        NetworkMode: awsvpc
        RequiresCompatibilities:
          - FARGATE
        Cpu: "256"
        Memory: "512"
        ExecutionRoleArn:
          Fn::ImportValue: Crediya-EcsExecutionRoleArn
        TaskRoleArn:
          Ref: EcsTaskRole
        ContainerDefinitions:
          - Name: container-authentication-api
            Image: ${opt:imageUri, '520236304018.dkr.ecr.us-east-1.amazonaws.com/authentication-api:latest'}
            PortMappings:
              - ContainerPort: 8080
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref LogGroup
                awslogs-region: ${self:provider.region}
                awslogs-stream-prefix: ecs
            Secrets:
              - Name: DB_USERS_USER
                ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CrediyaSecrets-${self:provider.stage}:DB_USERS_USER::"
              - Name: DB_USERS_PASSWORD
                ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CrediyaSecrets-${self:provider.stage}:DB_USERS_PASSWORD::"
              - Name: JWT_SECRET # <-- Cambiar de jwt.secret a JWT_SECRET
                ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:CrediyaSecrets-${self:provider.stage}:JWT_SECRET_KEY::"
            Environment:
              - Name: DB_HOST
                Value: !ImportValue Crediya-DBUsersEndpoint
              - Name: DB_PORT
                Value: "5432"
              - Name: DB_NAME
                Value: "users"

    EcsService:
      Type: AWS::ECS::Service
      Properties:
        ServiceName: authentication-api-service
        Cluster:
          Fn::ImportValue: Crediya-EcsClusterName
        TaskDefinition:
          Ref: TaskDefinition
        LaunchType: FARGATE
        DesiredCount: 1
        NetworkConfiguration:
          AwsvpcConfiguration:
            Subnets:
              - !ImportValue Crediya-PrivateSubnetA
              - !ImportValue Crediya-PrivateSubnetB
            SecurityGroups:
              - Ref: EcsServiceSecurityGroup
        LoadBalancers:
          - ContainerName: container-authentication-api
            ContainerPort: 8080
            TargetGroupArn:
              Ref: TargetGroup
        ServiceConnectConfiguration:
          Enabled: true
          Namespace: crediya-namespace
        DeploymentConfiguration:
          DeploymentCircuitBreaker:
            Enable: true
            Rollback: true
          MaximumPercent: 200
          MinimumHealthyPercent: 100

    # --- IAM Role específico para este servicio ---
    EcsTaskRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: EcsTaskRole-authentication-api
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - ecs-tasks.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: "auth-task-policy"
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action: ["secretsmanager:GetSecretValue"]
                  Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:crediya/*"

    # --- API Gateway V2 Resources ---
    # Definir el HTTP API Gateway explícitamente
    HttpApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: ${self:service}-${self:provider.stage}-http-api
        ProtocolType: HTTP
        # Si necesitas CORS, configúralo aquí
        CorsConfiguration:
          AllowOrigins:
            - '*'
          AllowHeaders:
            - 'Content-Type'
            - 'X-Amz-Date'
            - 'Authorization'
            - 'X-Api-Key'
            - 'X-Amz-Security-Token'
            - 'X-Amz-User-Agent'
            - 'X-Amzn-Trace-Id'
          AllowMethods:
            - 'GET'
          AllowCredentials: false
          MaxAge: 600

    # Definir la integración HTTP_PROXY para el ALB
    AuthenticationApiIntegration:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        Description: 'HTTP Proxy Integration for Authentication API'
        IntegrationType: HTTP_PROXY
        IntegrationMethod: GET
        IntegrationUri: !ImportValue Crediya-ALBListenerArn
        ConnectionId: !ImportValue Crediya-VpcLinkId
        ConnectionType: VPC_LINK
        PayloadFormatVersion: '1.0' # O '2.0'
        TimeoutInMillis: 30000

    # Definir la ruta para el API Gateway
    AuthenticationApiRoute:
      Type: AWS::ApiGatewayV2::Route
      Properties:
        ApiId: !Ref HttpApi
        RouteKey: 'GET /auth/{proxy+}'
        Target: !Join ['', ['integrations/', !Ref AuthenticationApiIntegration]]

    # Definir el Stage del API Gateway
    HttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref HttpApi
        StageName: ${self:provider.stage}
        AutoDeploy: true
        # AccessLogSettings: # Opcional: Configuración de logs de acceso
        #   DestinationArn: !GetAtt LogGroup.Arn
        #   Format: '{"requestId":"$context.requestId", "ip":"$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength"}'

  Outputs:
    HttpApiUrl:
      Description: "URL of the HTTP API Gateway"
      Value: !GetAtt HttpApi.ApiEndpoint
      Export:
        Name: ${self:service}-${self:provider.stage}-HttpApiUrl